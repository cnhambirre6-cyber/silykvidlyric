<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SilykVidLyric — SilykaVision™</title>
<meta name="description" content="Gerador gratuito de lyric videos. By SilykaVision™"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{overflow:hidden;background:#080A0D;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:#111;}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}
  input,textarea{color:#CBD5E1!important;}
  input::placeholder,textarea::placeholder{color:#374151!important;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const GENRES = {
  afrobeat: { label:"Afrobeat",  bg1:"#0A0200", bg2:"#1C0800", accent:"#FF6B00", particle:"#FF9900", text:"#FFF5E6" },
  amapiano: { label:"Amapiano",  bg1:"#06000F", bg2:"#110025", accent:"#C084FC", particle:"#A855F7", text:"#F5E8FF" },
  hiphop:   { label:"Hip-Hop",   bg1:"#000409", bg2:"#04101F", accent:"#00D4FF", particle:"#0099FF", text:"#E0F4FF" },
  pop:      { label:"Pop",       bg1:"#0F0008", bg2:"#1E0015", accent:"#FF3A8C", particle:"#FF69B4", text:"#FFE6F4" },
};

const DIMS = { "169":[1280,720], "916":[720,1280], "11":[1080,1080] };

function hexRgb(hex){ return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)].join(","); }
function alphaHex(a){ return Math.floor(Math.max(0,Math.min(1,a))*255).toString(16).padStart(2,"0"); }

function parseLRC(text){
  return text.split("\n")
    .map(l=>l.match(/\[(\d+):(\d+\.?\d*)\](.*)/))
    .filter(Boolean)
    .map(m=>({time:parseInt(m[1])*60+parseFloat(m[2]),text:m[3].trim()}))
    .sort((a,b)=>a.time-b.time);
}

function autoTime(text,dur){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length||!dur) return [];
  const gap=Math.max(1,(dur-2)/lines.length);
  return lines.map((text,i)=>({time:2+i*gap,text}));
}

function fmt(t){
  const m=Math.floor(t/60).toString().padStart(2,"0");
  const s=Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function App() {
  const [audioUrl, setAudioUrl]       = useState(null);
  const [lyrics, setLyrics]           = useState("");
  const [lrcData, setLrcData]         = useState([]);
  const [isPlaying, setIsPlaying]     = useState(false);
  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration]       = useState(0);
  const [genre, setGenre]             = useState("afrobeat");
  const [ratio, setRatio]             = useState("916");
  const [songTitle, setSongTitle]     = useState("Adiar a morte");
  const [artist, setArtist]           = useState("Silykane");
  const [tab, setTab]                 = useState("lyrics");
  const [exporting, setExporting]     = useState(false);
  const [exportPct, setExportPct]     = useState(0);
  const [statusMsg, setStatusMsg]     = useState("");

  const canvasRef  = useRef(null);
  const audioRef   = useRef(null);
  const acRef      = useRef(null);
  const analyserRef= useRef(null);
  const srcRef     = useRef(null);
  const rafRef     = useRef(null);
  const partsRef   = useRef([]);
  const lineRef    = useRef(-1);
  const transRef   = useRef(0);
  const lrcRef     = useRef([]);
  const genreRef   = useRef("afrobeat");
  const ratioRef   = useRef("916");
  const titleRef   = useRef("Adiar a morte");
  const artistRef  = useRef("Silykane");
  const chunksRef  = useRef([]);
  const durRef     = useRef(0);

  useEffect(()=>{ lrcRef.current   = lrcData;   }, [lrcData]);
  useEffect(()=>{ genreRef.current = genre;     }, [genre]);
  useEffect(()=>{ ratioRef.current = ratio;     }, [ratio]);
  useEffect(()=>{ titleRef.current = songTitle; }, [songTitle]);
  useEffect(()=>{ artistRef.current= artist;    }, [artist]);
  useEffect(()=>{ durRef.current   = duration;  }, [duration]);

  const initParticles = useCallback((w,h)=>{
    partsRef.current = Array.from({length:90},()=>({
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-0.5)*0.35,
      vy:-(Math.random()*0.55+0.15),
      r:Math.random()*2.5+0.5,
      op:Math.random()*0.55+0.1,
      life:Math.random()
    }));
  },[]);

  useEffect(()=>{
    const [w,h]=DIMS[ratio];
    const cvs=canvasRef.current; if(!cvs) return;
    cvs.width=w; cvs.height=h;
    initParticles(w,h);
  },[ratio,initParticles]);

  const draw = useCallback(()=>{
    const cvs=canvasRef.current; if(!cvs) return;
    const ctx=cvs.getContext("2d");
    const [w,h]=DIMS[ratioRef.current];
    const G=GENRES[genreRef.current];
    const lrc=lrcRef.current;
    const li=lineRef.current;
    if(cvs.width!==w||cvs.height!==h){ cvs.width=w; cvs.height=h; initParticles(w,h); }

    const bg=ctx.createLinearGradient(0,0,w,h);
    bg.addColorStop(0,G.bg1); bg.addColorStop(1,G.bg2);
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);

    const rg=ctx.createRadialGradient(w/2,h*0.5,0,w/2,h*0.5,w*0.55);
    rg.addColorStop(0,G.accent+"1A"); rg.addColorStop(1,"transparent");
    ctx.fillStyle=rg; ctx.fillRect(0,0,w,h);

    transRef.current=Math.min(1,transRef.current+0.028);
    partsRef.current.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.life+=0.004;
      if(p.y<-5||p.life>1){ p.y=h+5; p.x=Math.random()*w; p.life=0; p.op=Math.random()*0.55+0.1; }
      const a=p.op*Math.sin(p.life*Math.PI);
      if(a<=0.01) return;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=G.particle+alphaHex(a); ctx.fill();
    });

    const BARS=52,BWf=w*0.011,BH=h*0.055,WY=h*0.87;
    if(analyserRef.current){
      const buf=new Uint8Array(analyserRef.current.frequencyBinCount);
      analyserRef.current.getByteFrequencyData(buf);
      for(let i=0;i<BARS;i++){
        const v=buf[Math.floor(i*buf.length/BARS)]/255;
        const bh=v*BH+h*0.004;
        const x=w/2+(i-BARS/2)*(BWf*1.35);
        ctx.fillStyle=G.accent+alphaHex(0.3+v*0.7);
        ctx.fillRect(x,WY-bh,BWf,bh*2);
      }
    } else {
      for(let i=0;i<BARS;i++){
        const v=Math.abs(Math.sin(i*0.45+Date.now()*0.0022))*0.4+0.08;
        const bh=v*BH;
        const x=w/2+(i-BARS/2)*(BWf*1.35);
        ctx.fillStyle=G.accent+"40";
        ctx.fillRect(x,WY-bh,BWf,bh*2);
      }
    }

    const TS=Math.round(h*0.028);
    ctx.shadowBlur=0;
    ctx.font=`700 ${TS}px 'Bebas Neue',serif`;
    ctx.textAlign="left";
    ctx.fillStyle=G.accent;
    ctx.fillText(titleRef.current.toUpperCase(),w*0.06,h*0.078);
    ctx.font=`400 ${Math.round(TS*0.62)}px 'DM Sans',sans-serif`;
    ctx.fillStyle=G.text+"88";
    ctx.fillText(artistRef.current,w*0.06,h*0.078+TS*1.35);
    ctx.beginPath();
    ctx.moveTo(w*0.06,h*0.11); ctx.lineTo(w*0.28,h*0.11);
    ctx.strokeStyle=G.accent+"44"; ctx.lineWidth=1; ctx.stroke();

    const CY=h*0.48,SP=h*0.077,MSIZ=Math.round(h*0.047),SSIZ=Math.round(h*0.026),T=transRef.current;
    if(lrc.length===0){
      ctx.font=`400 ${SSIZ}px 'DM Sans',sans-serif`;
      ctx.textAlign="center"; ctx.fillStyle=G.text+"2A";
      ctx.fillText("ADICIONA A LETRA DA MÚSICA",w/2,CY);
    }
    [-2,-1,0,1,2].forEach(off=>{
      const idx=li+off;
      if(idx<0||idx>=lrc.length) return;
      const txt=lrc[idx].text.toUpperCase();
      const y=CY+off*SP;
      if(off===0){
        const sz=SSIZ+(MSIZ-SSIZ)*T;
        ctx.font=`800 ${sz}px 'Bebas Neue',serif`;
        ctx.textAlign="center";
        ctx.shadowColor=G.accent; ctx.shadowBlur=28*T;
        ctx.fillStyle=`rgba(${hexRgb(G.text)},${T.toFixed(2)})`;
        ctx.fillText(txt,w/2,y);
        ctx.shadowBlur=0;
        const tw=ctx.measureText(txt).width;
        const lw=tw*T;
        ctx.beginPath();
        ctx.moveTo(w/2-lw/2,y+sz*0.22); ctx.lineTo(w/2+lw/2,y+sz*0.22);
        ctx.strokeStyle=G.accent+alphaHex(T*0.85); ctx.lineWidth=2.5; ctx.stroke();
      } else {
        const da=Math.max(0,0.26-Math.abs(off)*0.09);
        ctx.font=`400 ${SSIZ}px 'DM Sans',sans-serif`;
        ctx.textAlign="center";
        ctx.fillStyle=`rgba(${hexRgb(G.text)},${da.toFixed(2)})`;
        ctx.fillText(txt,w/2,y);
      }
    });

    ctx.font=`300 ${Math.round(h*0.016)}px 'DM Sans',sans-serif`;
    ctx.textAlign="right"; ctx.fillStyle=G.accent+"30";
    ctx.fillText("SilykaVision™",w*0.94,h*0.965);
  },[initParticles]);

  useEffect(()=>{
    const loop=()=>{ draw(); rafRef.current=requestAnimationFrame(loop); };
    rafRef.current=requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[draw]);

  const setupAudio = useCallback(async()=>{
    if(acRef.current||!audioRef.current) return;
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    acRef.current=ac;
    const an=ac.createAnalyser(); an.fftSize=128;
    analyserRef.current=an;
    const src=ac.createMediaElementSource(audioRef.current);
    srcRef.current=src;
    src.connect(an); an.connect(ac.destination);
  },[]);

  const handleAudioUpload=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    if(audioUrl) URL.revokeObjectURL(audioUrl);
    if(acRef.current){ acRef.current.close(); acRef.current=null; analyserRef.current=null; srcRef.current=null; }
    const url=URL.createObjectURL(f);
    setAudioUrl(url);
    setSongTitle(f.name.replace(/\.[^.]+$/,"").replace(/[-_]/g," "));
    setIsPlaying(false); setCurrentTime(0); setStatusMsg("");
  };

  const handleLyrics=(val)=>{
    setLyrics(val);
    if(/\[\d+:\d/.test(val)){ const p=parseLRC(val); if(p.length){ setLrcData(p); return; } }
    setLrcData(autoTime(val,durRef.current));
  };

  const onTimeUpdate=()=>{
    const t=audioRef.current?.currentTime||0;
    setCurrentTime(t);
    const lrc=lrcRef.current;
    let idx=-1;
    for(let i=lrc.length-1;i>=0;i--){ if(t>=lrc[i].time){ idx=i; break; } }
    if(idx!==lineRef.current){ lineRef.current=idx; transRef.current=0; }
  };

  const onLoaded=()=>{
    const d=audioRef.current?.duration||0;
    setDuration(d); durRef.current=d;
    if(lyrics&&!/\[\d+:\d/.test(lyrics)) setLrcData(autoTime(lyrics,d));
    setStatusMsg("");
  };

  const togglePlay=async()=>{
    if(!audioRef.current||!audioUrl) return;
    await setupAudio();
    if(acRef.current?.state==="suspended") await acRef.current.resume();
    if(isPlaying){ audioRef.current.pause(); setIsPlaying(false); }
    else{ audioRef.current.play().catch(e=>setStatusMsg("Erro: "+e.message)); setIsPlaying(true); }
  };

  const seek=(e)=>{
    if(!audioRef.current||!duration) return;
    const r=e.currentTarget.getBoundingClientRect();
    audioRef.current.currentTime=((e.clientX-r.left)/r.width)*duration;
  };

  const exportVideo=async()=>{
    if(!canvasRef.current) return;
    setExporting(true); setExportPct(0); setStatusMsg("A preparar exportação…");
    await setupAudio();
    const cvs=canvasRef.current;
    let stream=cvs.captureStream(30);
    if(acRef.current&&srcRef.current){
      try{
        const dest=acRef.current.createMediaStreamDestination();
        srcRef.current.connect(dest);
        stream=new MediaStream([...cvs.captureStream(30).getTracks(),...dest.stream.getTracks()]);
      }catch(e){}
    }
    const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"video/webm";
    chunksRef.current=[];
    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000});
    rec.ondataavailable=e=>{ if(e.data.size>0) chunksRef.current.push(e.data); };
    rec.onstop=()=>{
      const blob=new Blob(chunksRef.current,{type:mime});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=`${titleRef.current||"lyric-video"}.webm`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setExporting(false); setExportPct(0); setStatusMsg("✓ Vídeo exportado!");
    };
    if(audioRef.current){ audioRef.current.currentTime=0; audioRef.current.play(); setIsPlaying(true); }
    rec.start(200);
    setStatusMsg("⏺ A gravar…");
    const dur=(durRef.current||30)*1000;
    const tick=setInterval(()=>setExportPct(p=>Math.min(p+(100/(dur/400)),95)),400);
    setTimeout(()=>{ clearInterval(tick); if(rec.state!=="inactive") rec.stop(); if(audioRef.current){ audioRef.current.pause(); setIsPlaying(false); } },dur);
  };

  const G=GENRES[genre];
  const pct=duration?(currentTime/duration)*100:0;
  const previewStyle=ratio==="169"
    ?{width:"100%",aspectRatio:"16/9",maxHeight:260}
    :ratio==="916"
    ?{width:165,aspectRatio:"9/16",margin:"0 auto"}
    :{width:210,aspectRatio:"1/1",margin:"0 auto"};

  return (
    <div style={{height:"100vh",width:"100vw",display:"flex",flexDirection:"column",overflow:"hidden",background:"#080A0D",fontFamily:"'DM Sans',sans-serif",color:"#CBD5E1"}}>
      {/* Header */}
      <header style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 20px",borderBottom:"1px solid #141820",background:"#0B0D13",flexShrink:0,gap:12}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10}}>
          <span style={{fontFamily:"'Bebas Neue',serif",fontSize:22,color:G.accent,letterSpacing:3}}>SilykVidLyric</span>
          <span style={{fontSize:10,color:"#374151",letterSpacing:1}}>by SilykaVision™</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          {statusMsg&&<span style={{fontSize:11,color:G.accent+"CC"}}>{statusMsg}</span>}
          {exporting?(
            <div style={{background:"#111827",border:`1px solid ${G.accent}44`,borderRadius:8,padding:"6px 14px",minWidth:160}}>
              <div style={{fontSize:11,color:G.accent,marginBottom:4}}>A exportar… {Math.floor(exportPct)}%</div>
              <div style={{background:"#1F2937",height:3,borderRadius:2}}>
                <div style={{background:G.accent,height:"100%",borderRadius:2,width:`${exportPct}%`,transition:"width 0.4s"}}/>
              </div>
            </div>
          ):(
            <button onClick={exportVideo} style={{background:`linear-gradient(135deg,${G.accent},${G.particle})`,border:"none",borderRadius:8,padding:"8px 18px",fontSize:12,fontWeight:700,color:"#000",cursor:"pointer",letterSpacing:0.5}}>
              ⬇ EXPORTAR VÍDEO
            </button>
          )}
        </div>
      </header>

      {/* Body */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* Left Panel */}
        <aside style={{width:272,borderRight:"1px solid #141820",background:"#0B0D13",display:"flex",flexDirection:"column",flexShrink:0,overflowY:"auto"}}>
          <div style={{display:"flex",borderBottom:"1px solid #141820",flexShrink:0}}>
            {[["lyrics","🎵 Letra"],["settings","⚙ Estilo"]].map(([id,lbl])=>(
              <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:"10px 0",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:1,background:"none",border:"none",cursor:"pointer",color:tab===id?G.accent:"#374151",borderBottom:tab===id?`2px solid ${G.accent}`:"2px solid transparent",transition:"color 0.2s"}}>
                {lbl}
              </button>
            ))}
          </div>

          <div style={{padding:16,display:"flex",flexDirection:"column",gap:14,flex:1}}>
            {tab==="lyrics"?(
              <>
                <div>
                  <div style={{fontSize:10,color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Ficheiro de Áudio</div>
                  <label style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",borderRadius:8,border:`1px dashed ${audioUrl?G.accent+"88":"#1E2530"}`,background:"#0F1219",cursor:"pointer",fontSize:11,color:audioUrl?G.accent:"#374151"}}>
                    <span style={{fontSize:16}}>{audioUrl?"✓":"🎵"}</span>
                    <span>{audioUrl?"Áudio carregado":"Carregar MP3 / WAV / OGG"}</span>
                    <input type="file" accept="audio/*" style={{display:"none"}} onChange={handleAudioUpload}/>
                  </label>
                </div>
                {[["Título da Música",songTitle,setSongTitle],["Nome do Artista",artist,setArtist]].map(([lbl,val,set])=>(
                  <div key={lbl}>
                    <div style={{fontSize:10,color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>{lbl}</div>
                    <input value={val} onChange={e=>set(e.target.value)} style={{width:"100%",background:"#0F1219",border:"1px solid #1E2530",borderRadius:6,padding:"7px 10px",fontSize:12,outline:"none"}}/>
                  </div>
                ))}
                <div style={{flex:1}}>
                  <div style={{fontSize:10,color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Letra (texto ou .LRC)</div>
                  <textarea value={lyrics} onChange={e=>handleLyrics(e.target.value)} rows={11}
                    placeholder={"Uma linha por verso:\n\nAdiar a morte\nÉ viver em silêncio\n\nOU formato LRC:\n[00:10.00]Primeira linha\n[00:15.00]Segunda linha"}
                    style={{width:"100%",background:"#0F1219",border:"1px solid #1E2530",borderRadius:6,padding:"8px 10px",fontSize:10.5,fontFamily:"monospace",lineHeight:1.75,resize:"vertical",outline:"none"}}/>
                  <div style={{fontSize:10,color:"#374151",marginTop:5}}>{lrcData.length} linha(s) · {audioUrl?fmt(duration):"sem áudio"}</div>
                </div>
              </>
            ):(
              <>
                <div>
                  <div style={{fontSize:10,color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Género Musical</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    {Object.entries(GENRES).map(([k,v])=>(
                      <button key={k} onClick={()=>setGenre(k)} style={{padding:"9px 6px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",textAlign:"center",background:genre===k?v.accent+"1E":"#0F1219",border:`1px solid ${genre===k?v.accent:"#1E2530"}`,color:genre===k?v.accent:"#475569",transition:"all 0.2s"}}>
                        {v.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#475569",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Proporção do Vídeo</div>
                  <div style={{display:"flex",gap:6}}>
                    {[["169","16:9"],["916","9:16"],["11","1:1"]].map(([v,l])=>(
                      <button key={v} onClick={()=>setRatio(v)} style={{flex:1,padding:"8px 4px",borderRadius:8,fontSize:10,fontWeight:600,cursor:"pointer",background:ratio===v?G.accent:"#0F1219",border:`1px solid ${ratio===v?G.accent:"#1E2530"}`,color:ratio===v?"#000":"#475569",transition:"all 0.2s"}}>
                        {l}
                      </button>
                    ))}
                  </div>
                </div>
                <div style={{background:"#0F1219",border:"1px solid #1E2530",borderRadius:8,padding:12,marginTop:4}}>
                  <div style={{fontSize:11,color:"#475569",lineHeight:2}}>
                    <span style={{color:G.accent}}>✓</span> 100% gratuito, sem APIs pagas<br/>
                    <span style={{color:G.accent}}>✓</span> Renderizado no browser<br/>
                    <span style={{color:G.accent}}>✓</span> Exporta em WebM<br/>
                    <span style={{color:G.accent}}>✓</span> Sincronização automática<br/>
                    <span style={{color:G.accent}}>✓</span> Suporta ficheiros .LRC
                  </div>
                </div>
                <div style={{marginTop:"auto",background:`${G.accent}0A`,border:`1px solid ${G.accent}33`,borderRadius:8,padding:12}}>
                  <div style={{fontSize:10,color:G.accent,fontWeight:700,marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>Como usar</div>
                  <div style={{fontSize:11,color:"#64748B",lineHeight:1.8}}>
                    1. Carrega o ficheiro de áudio<br/>
                    2. Cola a letra da música<br/>
                    3. Escolhe género e proporção<br/>
                    4. Clica em "Exportar Vídeo"
                  </div>
                </div>
              </>
            )}
          </div>
        </aside>

        {/* Center Canvas */}
        <main style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:20,overflow:"hidden",background:"#080A0D"}}>
          <div style={{...previewStyle,position:"relative",borderRadius:10,overflow:"hidden",boxShadow:`0 0 50px ${G.accent}1A,0 24px 80px rgba(0,0,0,0.9)`,border:`1px solid ${G.accent}18`}}>
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block"}}/>
          </div>
          <div style={{width:"100%",maxWidth:380,display:"flex",flexDirection:"column",gap:6}}>
            <div style={{background:"#141820",borderRadius:4,height:4,cursor:"pointer",overflow:"hidden"}} onClick={seek}>
              <div style={{background:G.accent,height:"100%",width:`${pct}%`,transition:"width 0.15s",borderRadius:4}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#374151"}}>
              <span>{fmt(currentTime)}</span><span>{fmt(duration)}</span>
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginTop:4}}>
              <button onClick={()=>{ if(audioRef.current) audioRef.current.currentTime=Math.max(0,audioRef.current.currentTime-10); }} style={{background:"none",border:"none",color:"#374151",cursor:"pointer",fontSize:18,padding:4}}>⏪</button>
              <button onClick={togglePlay} disabled={!audioUrl} style={{background:audioUrl?G.accent:"#141820",border:"none",borderRadius:"50%",width:46,height:46,cursor:audioUrl?"pointer":"not-allowed",fontSize:17,display:"flex",alignItems:"center",justifyContent:"center",color:audioUrl?"#000":"#374151",fontWeight:900,boxShadow:audioUrl?`0 0 20px ${G.accent}44`:"none",transition:"all 0.2s"}}>
                {isPlaying?"⏸":"▶"}
              </button>
              <button onClick={()=>{ if(audioRef.current) audioRef.current.currentTime=Math.min(duration,audioRef.current.currentTime+10); }} style={{background:"none",border:"none",color:"#374151",cursor:"pointer",fontSize:18,padding:4}}>⏩</button>
            </div>
            {!audioUrl&&<p style={{textAlign:"center",fontSize:11,color:"#1E2530",marginTop:4}}>Carrega um ficheiro de áudio para pré-visualizar e exportar</p>}
          </div>
        </main>
      </div>

      <audio ref={audioRef} src={audioUrl||undefined} onTimeUpdate={onTimeUpdate} onLoadedMetadata={onLoaded} onEnded={()=>setIsPlaying(false)} style={{display:"none"}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
